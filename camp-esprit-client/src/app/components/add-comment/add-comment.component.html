<!-- src/app/components/add-comment/add-comment.component.html -->
<div *ngIf="showAddComment">
    <form (ngSubmit)="submitComment()">
        <div class="form-group">
            <textarea [(ngModel)]="content" name="content" class="form-control" placeholder="Add a comment..." rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
<button (click)="toggleAddComment()" class="btn btn-link">Add Comment</button>
